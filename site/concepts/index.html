<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>概念图册 · Demo</title><link rel="stylesheet" href="../style.css"><link rel="icon" href="../pop-up-atlas/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="../passage.css" data-portfolio-passage>
<script src="../passage.js"></script>
</head>
<body><header class="header"><a class="wordmark" href="../">Demo</a><nav><a href="../">返回作品集</a></nav></header>
<main>
<section id="chapel" class="section"><div class="section-heading"><h2>中世纪教堂</h2><p>点击查看原图。</p></div>
<div class="grid art-grid">
<figure><a href="./chapel/教堂-清晨.png"><img loading="lazy" decoding="async" src="../media/previews/教堂-清晨.webp" alt="清晨的礼拜堂"></a><figcaption>清晨</figcaption></figure>
<figure><a href="./chapel/教堂-阴雨.png"><img loading="lazy" decoding="async" src="../media/previews/教堂-阴雨.webp" alt="雨中的礼拜堂"></a><figcaption>阴雨</figcaption></figure>
<figure><a href="./chapel/教堂-月夜.png"><img loading="lazy" decoding="async" src="../media/previews/教堂-月夜.webp" alt="月光下的礼拜堂"></a><figcaption>月夜</figcaption></figure>
</div></section>
<section id="cards" class="section"><div class="section-heading"><h2>经典斗地主</h2></div>
<div class="grid art-grid">
<figure><a href="./cards/雨夜牌室.png"><img loading="lazy" decoding="async" src="../media/previews/雨夜牌室.webp" alt="雨夜室内的牌桌"></a><figcaption>雨夜牌室</figcaption></figure>
<figure><a href="./cards/花朝牌会.png"><img loading="lazy" decoding="async" src="../media/previews/花朝牌会.webp" alt="春日水榭里的牌桌"></a><figcaption>花朝牌会</figcaption></figure>
</div></section>
</main>
<dialog id="art-view" aria-label="原画预览"><img alt=""><div class="image-bar"><strong></strong><a target="_blank" rel="noopener">查看原图</a><button class="image-close" type="button" autofocus>关闭</button></div></dialog>
<script src="../portfolio.js"></script></body></html>
